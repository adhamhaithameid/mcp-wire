name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm provenance / OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify reviewed family snapshot
        run: bash scripts/check-family.sh
      - name: Engine tests (hermetic, offline)
        run: bash engine/tests/run-tests.sh

      - name: figma-wire unit tests (hermetic, offline)
        run: SKIP_NETWORK_TESTS=1 bash tests/run-tests.sh
        working-directory: skills/figma-wire

      - name: figma-wire installer e2e (sandboxed HOME)
        run: bash tests/e2e.sh
        working-directory: skills/figma-wire

      - name: Family scaffold and domain checks
        run: bash tests/test-family.sh && (cd skills/figma-wire && bash tests/test-domains.sh)

      - name: Verify extracted npm artifacts
        run: bash tests/test-package.sh

      # One-time setup (npmjs.com): mcp-wire package Settings -> Trusted Publisher
      # -> repo adhamhaithameid/mcp-wire, workflow release.yml.
      # Fallback: `gh secret set NPM_TOKEN` with a granular token, then uncomment:
      - name: Publish the mcp-wire family package to npm (skips if version already on the registry)
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VERSION" version > /dev/null 2> registry-error.log; then
            echo "$PKG@$VERSION already on the registry — skipping publish"
          elif grep -q 'E404' registry-error.log; then
            rm -f registry-error.log
            npm publish --access public
          else
            echo "Registry lookup failed; publication stopped."
            rm -f registry-error.log
            exit 1
          fi
          rm -f registry-error.log
        env:
          NPM_CONFIG_PROVENANCE: true
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release with generated notes
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate-notes: true
